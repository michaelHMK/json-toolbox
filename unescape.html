<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="titleUnescape">JSON Unescape - JSON Toolbox</title>
  <link rel="stylesheet" href="styles/app.css">
</head>
<body data-page="unescape" data-action="unescape">
  <div class="app-shell">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="page-shell">
      <header class="page-header">
        <div class="page-heading">
          <h1 data-i18n="navUnescape">JSON Unescape</h1>
          <p data-i18n="descUnescape">Restore escaped string content to its original text.</p>
        </div>
        <div class="page-actions">
          <button id="btn-cancel" hidden data-i18n="btnCancel">Cancel</button>
          <button id="btn-sample" data-i18n="btnSample">Sample</button>
          <button id="btn-clear" data-i18n="btnClear">Clear</button>
          <button id="btn-run" class="primary" data-i18n="btnUnescape" data-i18n-title="btnUnescapeTitle" title="Restore an escaped string to JSON text">Unescape</button>
        </div>
      </header>

      <div class="error-announcement" role="alert" aria-atomic="true">
        <div id="error" class="notice" hidden></div>
      </div>

      <main class="workspace">
        <section class="pane">
          <div class="pane-title"><span data-i18n="paneInput">Input</span></div>
          <textarea id="input" dir="ltr" data-i18n-aria-label="paneInput" aria-label="Input" spellcheck="false" wrap="off"
            data-i18n-placeholder="inputUnescapePlaceholder"
            placeholder="Paste escaped string content… (Cmd/Ctrl + Enter)"></textarea>
        </section>
        <section class="pane">
          <div class="pane-title">
            <div class="pane-label">
              <span data-i18n="paneResult">Result</span>
              <span id="status" class="status" role="status" aria-atomic="true"></span>
              <span role="status" aria-atomic="true"><span id="busy" hidden data-i18n="busyText">Working…</span></span>
            </div>
            <button id="btn-copy" class="button-compact" data-i18n="btnCopy">Copy result</button>
          </div>
          <pre role="region" tabindex="0" id="output-text" dir="ltr" data-i18n-aria-label="paneResult" aria-label="Result"></pre>
        </section>
      </main>
    </div>
  </div>
  <script type="module" src="src/pages/transform.js"></script>
</body>
</html>
