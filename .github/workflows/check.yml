name: Tests and performance budget
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Verify CodeMirror vendor bundle is reproducible
        run: |
          npm ci --prefix scripts/vendor-codemirror --ignore-scripts --no-audit --no-fund
          npm run build --prefix scripts/vendor-codemirror
          git diff --exit-code src/vendor/
      - run: npm test
      - run: npm run build:release
      # Same fixtures and separate processes; medians absorb VM scheduling noise.
      - run: npm run bench:budget
      - name: Load and exercise the packaged extension, accessibility and themes
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/chromium
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cp scripts/smoke-deps/package.json scripts/smoke-deps/package-lock.json "$RUNNER_TEMP/smoke/"
          npm ci --prefix "$RUNNER_TEMP/smoke" --ignore-scripts --no-audit --no-fund
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/smoke/node_modules/playwright-core/index.mjs"
          node bench/release-smoke.mjs dist/json-toolbox-*.zip
          node bench/accessibility.mjs
          node bench/theme.mjs
