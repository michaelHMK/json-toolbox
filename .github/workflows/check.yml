name: Tests and performance budget
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - run: npm test
      - run: npm run build:release
      # Same fixtures and separate processes; medians absorb VM scheduling noise.
      - run: npm run bench:budget
      - name: Load and exercise the packaged extension
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/smoke" --ignore-scripts --no-package-lock --no-audit --no-fund playwright-core@1.65.1
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/smoke/node_modules/playwright-core/index.mjs" node bench/release-smoke.mjs dist/json-toolbox-*.zip
